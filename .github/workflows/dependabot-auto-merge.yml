# Every Dependabot update merges itself, but only a patch or a minor one, and
# only after the repository's own required checks are green on that exact
# commit. A major update is labelled and left open, because a major is the one
# that breaks something the tests do not cover.
#
# This file is deliberately identical in every repository here, and deliberately
# NOT a reusable workflow pulled from sapn95/.github: a workflow that merges to
# main on its own should not take its definition from somewhere else, or
# compromising one repository would compromise all of them.
#
# What decides "green" is GitHub's own answer: a pull request whose
# mergeStateStatus is CLEAN is mergeable with every required check passed.
# Hardcoding check names is how twelve copies of one file stop being one file,
# and reading branch protection instead needs admin rights the job token has
# not got.
#
# Nothing from the pull request is checked out or executed, so `pull_request`
# (not the riskier `pull_request_target`) is the right trigger. Dependabot runs
# start from a read-only token, which the permissions block below raises —
# GitHub's documented recipe for this job.
name: dependabot auto-merge

on:
  pull_request:
  # The daily catch-up, see the `reconcile` job.
  schedule:
    - cron: "23 5 * * *"

# One poll per pull request: a new push supersedes the running job rather than
# racing it.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-merge:
    name: auto-merge
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # to merge
      pull-requests: write # to label and to comment
      checks: read # `gh pr checks` reads the rollup
    steps:
      # For a grouped pull request this reports the HIGHEST semver change in the
      # group, which is the one that decides whether the whole PR is safe.
      - name: what kind of update is this
        id: meta
        uses: dependabot/fetch-metadata@v2

      # Anyone with push access can add a commit to a Dependabot branch, and
      # that commit would then ride into main on Dependabot's ticket. So check
      # the authorship of every commit and bail out if one is not Dependabot's.
      # The author login comes from the commit's email, which anyone with push
      # access could set to Dependabot's — so require a valid signature too.
      # Dependabot signs all of its commits.
      - name: who wrote the commits on this branch
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # One page of up to 100; a Dependabot PR has one or two commits. NOT
          # --paginate: with --jq that filters per page and prints one line per
          # page, which would never equal the single expected author.
          commits="$(gh api "repos/$REPO/pulls/$PR/commits?per_page=100" || echo '[]')"
          # Require the list to END at the SHA we later merge, so a force-push
          # between the two calls cannot make us vet one history and merge
          # another.
          head_sha="$(jq -r '.[-1].sha // ""' <<<"$commits")"
          authors="$(jq -r '[.[] | .author.login // "unknown"] | unique | join(",")' <<<"$commits")"
          signed="$(jq -r '[.[] | .commit.verification.verified] | all' <<<"$commits")"
          if [ "$head_sha" = "$SHA" ] && [ "$authors" = 'dependabot[bot]' ] && [ "$signed" = 'true' ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not auto-merging: head=$head_sha (expected $SHA),"
            echo "::notice::authors=$authors, all signed=$signed. Merge it by hand."
          fi

      # The label is the decision, written down where the reconcile job below
      # can read it: `dependabot/fetch-metadata` only works on a pull_request
      # event, and the daily sweep has none.
      - name: label it as eligible
        id: eligible
        if: >-
          steps.commits.outputs.clean == 'true' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label automerge-ok
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: say why it was left alone
        if: steps.commits.outputs.clean == 'true' && steps.eligible.outputs.ok != 'true'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: echo "::notice::$UPDATE_TYPE is not a patch or a minor — leaving this one open for review."

      # GitHub decides what "green" means here, rather than this job reading
      # branch protection itself: CLEAN is "mergeable, and every required check
      # has passed". One call, and no admin rights needed.
      - name: wait until GitHub calls it mergeable
        id: ci
        if: steps.eligible.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 110); do   # ~30 min, inside the job timeout
            # A transient API error must not kill the job: no further
            # pull_request event would fire for this PR, so it would never be
            # retried until the daily sweep.
            state="$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus \
              --jq .mergeStateStatus || echo UNKNOWN)"
            # Everything that is not this workflow's own two jobs. They are
            # check runs on the same commit, and the one doing the waiting can
            # never be green before it merges — so a pull request whose only
            # unhappy check is this job is a pull request that is ready.
            others="$(gh pr checks "$PR" --repo "$REPO" --json name,state --jq '
              [ .[] | select(.name != "auto-merge" and .name != "reconcile")
                    | select(.state != "SUCCESS" and .state != "SKIPPED") ] | length' || true)"
            case "$state" in
              CLEAN)
                echo "green=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              UNSTABLE)
                # Mergeable, with something non-required not green. If that
                # something is only this job, the required checks have passed.
                if [ "${others:-1}" = "0" ]; then
                  echo "green=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
              DIRTY | DRAFT)
                echo "::notice::$state — leaving the pull request open."
                echo "green=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            # BLOCKED means both "a required check has not finished" and "one
            # of them failed", so ask the checks themselves whether anything is
            # already red rather than polling a lost cause for half an hour.
            failed="$(gh pr checks "$PR" --repo "$REPO" --json name,state --jq '
              [ .[] | select(.name != "auto-merge" and .name != "reconcile")
                    | select(.state == "FAILURE") ] | length' || true)"
            if [ -n "$failed" ] && [ "$failed" != "0" ]; then
              echo "::notice::$failed check(s) red on this commit — leaving the pull request open."
              echo "green=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::notice::The checks did not finish in time — the daily sweep will pick this up."
          echo "green=false" >> "$GITHUB_OUTPUT"

      - name: merge
        if: steps.ci.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit: merge exactly the commit whose authorship and
        # checks were verified. Anything pushed during the poll aborts the merge
        # instead of riding in unchecked.
        run: gh pr merge --squash --delete-branch --match-head-commit "$SHA" "$PR_URL"

  # A pull request whose checks finished after the poll gave up — or that went
  # green only on a later re-run — gets no further pull_request event, so
  # nothing would ever merge it. This sweeps up those leftovers once a day,
  # under the same rules: the label says the semver level was already judged,
  # and authorship, signatures and the required checks are all re-checked here.
  reconcile:
    name: reconcile
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: merge every labelled Dependabot pull request that is already green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$REPO" --author 'app/dependabot' --label automerge-ok \
            --state open --limit 100 --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"')"
          if [ -z "$prs" ]; then
            echo "Nothing labelled and open."
            exit 0
          fi
          # Every pull request is handled independently: one rebased-mid-sweep or
          # otherwise unmergeable PR must not stop the rest of the batch.
          while read -r pr sha; do
            [ -n "$pr" ] || continue
            commits="$(gh api "repos/$REPO/pulls/$pr/commits?per_page=100" </dev/null || echo '[]')"
            head_sha="$(jq -r '.[-1].sha // ""' <<<"$commits")"
            authors="$(jq -r '[.[] | .author.login // "unknown"] | unique | join(",")' <<<"$commits")"
            signed="$(jq -r '[.[] | .commit.verification.verified] | all' <<<"$commits")"
            if [ "$head_sha" != "$sha" ] || [ "$authors" != 'dependabot[bot]' ] || [ "$signed" != 'true' ]; then
              echo "::notice::PR #$pr: head=$head_sha (listed $sha),"
              echo "::notice::authors=$authors, all signed=$signed — left for review."
              continue
            fi
            state="$(gh pr view "$pr" --repo "$REPO" --json mergeStateStatus \
              --jq .mergeStateStatus </dev/null || echo UNKNOWN)"
            # UNSTABLE counts too when the only unhappy check is this workflow's
            # own — see the same reasoning in the auto-merge job above.
            if [ "$state" = 'UNSTABLE' ]; then
              others="$(gh pr checks "$pr" --repo "$REPO" --json name,state </dev/null --jq '
                [ .[] | select(.name != "auto-merge" and .name != "reconcile")
                      | select(.state != "SUCCESS" and .state != "SKIPPED") ] | length' || true)"
              [ "${others:-1}" = "0" ] && state=CLEAN
            fi
            if [ "$state" = 'CLEAN' ]; then
              # A rebase between listing and merging makes this fail by design —
              # note it and move on to the next one.
              gh pr merge --repo "$REPO" --squash --delete-branch --match-head-commit "$sha" "$pr" </dev/null ||
                echo "::notice::PR #$pr could not be merged right now (head moved?) — the next sweep will retry."
            else
              echo "PR #$pr: $state"
            fi
          done <<<"$prs"
