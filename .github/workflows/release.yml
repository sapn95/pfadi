name: release

on:
  push:
    tags: ["v*"]
  # A tag push is a webhook, and GitHub throttles webhooks when Actions is
  # having a bad day. On 2026-08-06 a pushed tag produced no run at all and
  # three releases had to be cut by hand. A release should not rest on one
  # trigger, so it can also be asked for directly, for a tag that already
  # exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, for example v0.24.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Two tags pushed together would race over the formula, and the loser
  # publishes a release the tap was never pointed at.
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: the tag and VERSION agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: which tag is this
        id: resolve
        env:
          # From the ref when a tag was pushed, from the input when somebody
          # asked. Everything downstream reads this rather than github.ref, so
          # the two routes cannot drift apart.
          ASKED_FOR: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            resolved="${GITHUB_REF_NAME}"
          else
            resolved="${ASKED_FOR}"
          fi
          case "$resolved" in
            v*) ;;
            *)
              echo "not a release tag: '${resolved}'"
              exit 1
              ;;
          esac
          echo "tag=${resolved}" >> "$GITHUB_OUTPUT"
          echo "releasing ${resolved}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: compare
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${TAG#v} VERSION=$file"
          test "${TAG#v}" = "$file" || {
            echo "VERSION says $file, the tag says ${TAG#v}"
            exit 1
          }

  verify:
    name: it builds and the tests pass
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - name: build
        run: swift build -c release
      - name: self-test
        run: swift run pfadi-selftest
      - name: window and behaviour check
        # The same one CI runs. A release that builds and whose window is
        # unusable is worse than one that does not build.
        run: swift run pfadi --layout-check
      - name: the bundle assembles
        run: |
          ./scripts/make-app.sh
          plutil -lint build/Pfadi.app/Contents/Info.plist

  publish:
    name: publish the release
    needs: [guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          # Already there when a release was cut by hand and this is catching
          # up, which is the case workflow_dispatch exists for.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
      - name: checksum of the source tarball
        id: tarball
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        # The formula builds from source, so the only asset that matters is the
        # tarball GitHub generates for the tag. It exists once the release does.
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 5 --retry-delay 3 -o source.tar.gz "$url"
          sha="$(sha256sum source.tar.gz | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "tarball sha256: $sha"

  sign:
    name: sign and notarise
    needs: [guard, publish]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - name: is there a certificate to sign with
        id: secrets
        env:
          CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
        run: |
          if [ -z "${CERTIFICATE}" ]; then
            echo "::warning::No SIGNING_CERTIFICATE_P12, so this release is" \
                 "unsigned and will not open on anybody else's Mac."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: import the certificate
        if: steps.secrets.outputs.present == 'true'
        env:
          CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          # A keychain of its own, deleted with the runner. Importing into the
          # login keychain would leave the key behind on a self-hosted runner.
          keychain=build.keychain
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "${CERTIFICATE}" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$keychain" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          rm -f /tmp/certificate.p12
      - name: build, sign, notarise
        if: steps.secrets.outputs.present == 'true'
        env:
          PFADI_SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ./scripts/make-app.sh
          if [ -n "${APPLE_ID}" ]; then
            xcrun notarytool store-credentials pfadi \
              --apple-id "${APPLE_ID}" --team-id "${TEAM_ID}" \
              --password "${APP_PASSWORD}"
            PFADI_NOTARY_PROFILE=pfadi ./scripts/sign-and-notarise.sh
          else
            echo "::warning::Signed but not notarised: no notary credentials."
            ./scripts/sign-and-notarise.sh
          fi
      - name: attach the signed app to the release
        if: steps.secrets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          /usr/bin/ditto -c -k --keepParent build/Pfadi.app \
            "build/Pfadi-${TAG}.zip"
          gh release upload "${TAG}" \
            "build/Pfadi-${TAG}.zip" --clobber
