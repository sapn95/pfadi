name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new Swift or macOS release breaking an assumption is caught
    # without anyone having to push a commit first.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and self-test
    # AppKit means macOS, there is no cross-compiling out of this one.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, and `pull_request` runs code from strangers.
          persist-credentials: false
      - name: swift version
        run: swift --version
      - name: build
        run: swift build -v
      - name: self-test
        run: swift run pfadi-selftest
      - name: window and behaviour check
        # Builds the real window off-screen, measures it, and then clicks
        # through it. A layout mistake is invisible to a build and to the
        # tests: the application launches, and the window is sixty points tall
        # with the filter off the edge. So is a behaviour one: the model can be
        # right the whole time the thing on screen is unreachable.
        run: swift run pfadi --layout-check
      - name: coverage, with a floor under it
        # PfadiCore only: the AppKit half is covered by --layout-check above,
        # which drives a real window rather than reading the model, and mixing
        # the two numbers would hide whichever one was slipping.
        run: ./scripts/coverage.sh

      - name: mermaid-cli, for the diagram check below
        run: brew install mermaid-cli

      - name: every diagram in the README still renders
        # The README's diagrams are mermaid blocks, which GitHub renders
        # itself. Nothing else would notice one that stopped parsing, because
        # a broken block renders as its own source and looks like a code
        # sample.
        run: ./scripts/check-diagrams.sh

      - name: assemble the .app bundle
        run: ./scripts/make-app.sh
      - name: the bundle is actually launchable
        run: |
          test -x build/Pfadi.app/Contents/MacOS/pfadi
          plutil -lint build/Pfadi.app/Contents/Info.plist

  format:
    name: swift-format
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, and `pull_request` runs code from strangers.
          persist-credentials: false
      - name: lint
        run: swift format lint --recursive --strict Sources Tests Package.swift

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, and `pull_request` runs code from strangers.
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
        env:
          # shellcheck's info and style notes are advisory here; a warning or
          # worse blocks.
          SHELLCHECK_OPTS: --severity=warning
      - name: yamllint
        run: pipx run yamllint .
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
